<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventário da Liga</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --fg: #1d2430; --muted: #627083; --line: #d8dee6;
    --accent: #1f6feb; --accent-fg: #ffffff; --ok: #1a7f4b; --ok-bg: #e3f4ea; --warn: #9a5b00; --warn-bg: #fdf0d8; --danger: #c0352b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .usuario { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .chip.admin { background: #e8eefc; color: var(--accent); }
  .chip.membro { background: #eef0f3; color: var(--muted); }
  .chip.disponivel { background: var(--ok-bg); color: var(--ok); }
  .chip.emprestado { background: var(--warn-bg); color: var(--warn); }
  button, .botao { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  button.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.perigo { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  main { padding-block: 24px 48px; display: grid; gap: 24px; }
  .painel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  form.linha { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--fg); min-width: 0; }
  #aviso { min-height: 22px; font-size: 14px; }
  #aviso.erro { color: var(--danger); }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; }
  .foto { aspect-ratio: 4 / 3; background: #e9edf2; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .corpo { padding: 12px; display: grid; gap: 8px; }
  .nome { font-weight: 600; }
  .meta { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; }
  .acoes { display: flex; flex-wrap: wrap; gap: 6px; }
  .acoes button, .acoes .botao { font-size: 13px; padding: 4px 10px; }
  .editar { display: grid; gap: 6px; }
  .entrar { text-align: center; padding: 64px 16px; display: grid; gap: 16px; justify-items: center; }
  .vazio { color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Inventário da Liga</h1>
    <div class="usuario" id="usuario" hidden>
      <span id="email"></span><span id="papel" class="chip"></span>
      <button id="sair">Sair</button>
    </div>
  </div>
</header>

<div class="wrap">
  <section class="entrar" id="tela-login" hidden>
    <p>Entre com a sua conta da liga para ver o catálogo e pedir empréstimos.</p>
    <button class="primario" id="entrar">Entrar</button>
  </section>

  <main id="tela-app" hidden>
    <div id="aviso" role="status"></div>

    <section class="painel" id="painel-admin" hidden>
      <h2>Cadastrar item</h2>
      <form class="linha" id="form-novo">
        <label>Nome <input id="novo-nome" required placeholder="Ex.: Protoboard 830 pontos"></label>
        <label>Categoria
          <select id="novo-categoria">
            <option>kits</option><option>placas</option><option>cabos</option>
            <option>notebooks</option><option>ferramentas</option><option>outros</option>
          </select>
        </label>
        <label>Foto (JPEG) <input id="novo-foto" type="file" accept="image/jpeg"></label>
        <button class="primario" type="submit">Cadastrar</button>
      </form>
    </section>

    <section>
      <h2>Catálogo</h2>
      <div class="grade" id="lista"></div>
    </section>
  </main>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
